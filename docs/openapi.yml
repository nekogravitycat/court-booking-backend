openapi: 3.0.3

info:
  title: Court Booking Backend API
  version: "v1"
  description: Court Booking Backend — API v1

servers:
  - url: https://api-field.gravitycat.tw/v1
    description: Production Server
  - url: http://localhost:8080/v1
    description: Local Server

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: 身份認證
  - name: Me
    description: 目前登入者
  - name: Users
    description: 使用者
  - name: Organizations
    description: 組織
  - name: Organization Members
    description: 組織成員
  - name: Organization Managers
    description: 組織管理員
  - name: Locations
    description: 場域
  - name: Location Managers
    description: 場域管理員
  - name: Resources
    description: 場地 (實際可預約單位，如：A球場、B會議室)
  - name: Bookings
    description: 場地預約
  - name: Announcements
    description: 系統公告
  - name: Files
    description: 檔案存取
  - name: Sports
    description: 球類 (系統管理員維護，公開讀取)
  - name: Skill Levels
    description: 程度分級 (系統管理員維護，公開讀取)
  - name: Pickup Groups
    description: 臨打團
  - name: Pickup Orders
    description: 臨打團訂單
  - name: Pickup Hosts
    description: 球團主辦人身分管理 (系統管理員)
  - name: Favorites
    description: 我的最愛
  - name: Notifications
    description: 站內通知 (個人收件匣)
  - name: Coaches
    description: 教練資料與申請審核
  - name: Coach Groups
    description: 教練團、成員與邀請
  - name: Courses
    description: 課程、場次與報名
  - name: Enrollments
    description: 我的報名
  - name: Payments
    description: 付款狀態、轉帳回報與核帳 (收款方為教練)
  - name: Cancellations
    description: 取消、爽約與退款紀錄
  - name: Attendance
    description: 請假、補課與出席
  - name: Reviews
    description: 教練公開評價
  - name: Complaints
    description: 申訴 (學員 / 教練)
  - name: Reputation
    description: 教練內部信譽 (系統管理員)
  - name: Suspensions
    description: 教練停權 (系統管理員)
  - name: System
    description: 系統資訊

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    page:
      $ref: "./components/parameters.yml#/page"
    page_size:
      $ref: "./components/parameters.yml#/page_size"

  schemas:
    # --------------------------
    # Common Responses
    # --------------------------
    ErrorResponse:
      $ref: "./components/schemas/common.yml#/ErrorResponse"

    PageResponse:
      $ref: "./components/schemas/common.yml#/PageResponse"

    VersionResponse:
      $ref: "./components/schemas/common.yml#/VersionResponse"

    # --------------------------
    # User Models
    # --------------------------
    UserResponse:
      $ref: "./components/schemas/user.yml#/UserResponse"

    MeResponse:
      $ref: "./components/schemas/user.yml#/MeResponse"

    RegisterRequest:
      $ref: "./components/schemas/user.yml#/RegisterRequest"

    LoginRequest:
      $ref: "./components/schemas/user.yml#/LoginRequest"

    LoginResponse:
      $ref: "./components/schemas/user.yml#/LoginResponse"

    UpdateUserRequest:
      $ref: "./components/schemas/user.yml#/UpdateUserRequest"

    UpdateMeRequest:
      $ref: "./components/schemas/user.yml#/UpdateMeRequest"

    # --------------------------
    # Organization Models
    # --------------------------
    OrganizationResponse:
      $ref: "./components/schemas/organization.yml#/OrganizationResponse"

    CreateOrganizationRequest:
      $ref: "./components/schemas/organization.yml#/CreateOrganizationRequest"

    # --------------------------
    # Manager Models
    # --------------------------
    ManagerResponse:
      $ref: "./components/schemas/member.yml#/ManagerResponse"

    AddOrganizationManagerRequest:
      $ref: "./components/schemas/member.yml#/AddOrganizationManagerRequest"

    AddMemberRequest:
      $ref: "./components/schemas/member.yml#/AddMemberRequest"

    # --------------------------
    # Location Models
    # --------------------------
    LocationResponse:
      $ref: "./components/schemas/location.yml#/LocationResponse"

    CreateLocationRequest:
      $ref: "./components/schemas/location.yml#/CreateLocationRequest"

    UpdateLocationRequest:
      $ref: "./components/schemas/location.yml#/UpdateLocationRequest"

    # --------------------------
    # Resource Models
    # --------------------------
    ResourceResponse:
      $ref: "./components/schemas/resource.yml#/ResourceResponse"

    CreateResourceRequest:
      $ref: "./components/schemas/resource.yml#/CreateResourceRequest"

    UpdateResourceRequest:
      $ref: "./components/schemas/resource.yml#/UpdateResourceRequest"

    # --------------------------
    # Booking Models
    # --------------------------
    BookingResponse:
      $ref: "./components/schemas/booking.yml#/BookingResponse"

    CreateBookingRequest:
      $ref: "./components/schemas/booking.yml#/CreateBookingRequest"

    UpdateBookingRequest:
      $ref: "./components/schemas/booking.yml#/UpdateBookingRequest"

    CreateBookingSeriesRequest:
      $ref: "./components/schemas/booking.yml#/CreateBookingSeriesRequest"

    BookingSeriesResponse:
      $ref: "./components/schemas/booking.yml#/BookingSeriesResponse"

    LocationAvailabilityResponse:
      $ref: "./components/schemas/booking.yml#/LocationAvailabilityResponse"

    CreatePickupGroupSeriesRequest:
      $ref: "./components/schemas/pickup.yml#/CreatePickupGroupSeriesRequest"

    PickupGroupSeriesResponse:
      $ref: "./components/schemas/pickup.yml#/PickupGroupSeriesResponse"

    UserPickupStatsResponse:
      $ref: "./components/schemas/pickup.yml#/UserPickupStatsResponse"

    # --------------------------
    # Announcement Models
    # --------------------------
    AnnouncementResponse:
      $ref: "./components/schemas/announcement.yml#/AnnouncementResponse"

    CreateAnnouncementRequest:
      $ref: "./components/schemas/announcement.yml#/CreateAnnouncementRequest"

    UpdateAnnouncementRequest:
      $ref: "./components/schemas/announcement.yml#/UpdateAnnouncementRequest"

    # --------------------------
    # Sport & Skill Level Models
    # --------------------------
    SportResponse:
      $ref: "./components/schemas/sport.yml#/SportResponse"

    CreateSportRequest:
      $ref: "./components/schemas/sport.yml#/CreateSportRequest"

    UpdateSportRequest:
      $ref: "./components/schemas/sport.yml#/UpdateSportRequest"

    SkillLevelResponse:
      $ref: "./components/schemas/skilllevel.yml#/SkillLevelResponse"

    CreateSkillLevelRequest:
      $ref: "./components/schemas/skilllevel.yml#/CreateSkillLevelRequest"

    UpdateSkillLevelRequest:
      $ref: "./components/schemas/skilllevel.yml#/UpdateSkillLevelRequest"

    # --------------------------
    # Pickup Models
    # --------------------------
    PickupGroupResponse:
      $ref: "./components/schemas/pickup.yml#/PickupGroupResponse"

    PickupGroupBrief:
      $ref: "./components/schemas/pickup.yml#/PickupGroupBrief"

    PickupGroupDetailResponse:
      $ref: "./components/schemas/pickup.yml#/PickupGroupDetailResponse"

    CreatePickupGroupRequest:
      $ref: "./components/schemas/pickup.yml#/CreatePickupGroupRequest"

    UpdatePickupGroupRequest:
      $ref: "./components/schemas/pickup.yml#/UpdatePickupGroupRequest"

    PickupOrderResponse:
      $ref: "./components/schemas/pickup.yml#/PickupOrderResponse"

    UpdatePickupOrderRequest:
      $ref: "./components/schemas/pickup.yml#/UpdatePickupOrderRequest"

    CreatePickupOrderRequest:
      $ref: "./components/schemas/pickup.yml#/CreatePickupOrderRequest"

    CreatePartyOrderRequest:
      $ref: "./components/schemas/pickup.yml#/CreatePartyOrderRequest"

    PartyMember:
      $ref: "./components/schemas/pickup.yml#/PartyMember"

    ParticipantStatsResponse:
      $ref: "./components/schemas/pickup.yml#/ParticipantStatsResponse"

    # --------------------------
    # Skill Rating Models
    # --------------------------
    RateParticipantRequest:
      $ref: "./components/schemas/skillrating.yml#/RateParticipantRequest"

    SkillRatingResponse:
      $ref: "./components/schemas/skillrating.yml#/SkillRatingResponse"

    SkillSummaryResponse:
      $ref: "./components/schemas/skillrating.yml#/SkillSummaryResponse"

    # --------------------------
    # Notification Models
    # --------------------------
    NotificationResponse:
      $ref: "./components/schemas/notification.yml#/NotificationResponse"

    UnreadCountResponse:
      $ref: "./components/schemas/notification.yml#/UnreadCountResponse"

    MarkAllReadResponse:
      $ref: "./components/schemas/notification.yml#/MarkAllReadResponse"

    # --------------------------
    # Pickup Host Models
    # --------------------------
    AddPickupHostRequest:
      $ref: "./components/schemas/user.yml#/AddPickupHostRequest"

    # --------------------------
    # Favorite Models
    # --------------------------
    FavoriteHostResponse:
      $ref: "./components/schemas/favorite.yml#/FavoriteHostResponse"

    FavoriteHostRequest:
      $ref: "./components/schemas/favorite.yml#/FavoriteHostRequest"

paths:
  # ============================
  # System
  # ============================
  /version:
    $ref: "./paths/system.yml#/version"

  # ============================
  # Auth
  # ============================
  /auth/register:
    $ref: "./paths/auth.yml#/register"

  /auth/login:
    $ref: "./paths/auth.yml#/login"

  /auth/line:
    $ref: "./paths/auth.yml#/line"
  /auth/refresh:
    $ref: "./paths/auth.yml#/refresh"
  /auth/logout:
    $ref: "./paths/auth.yml#/logout"

  # ============================
  # Me
  # ============================
  /me:
    $ref: "./paths/me.yml#/me"

  /me/identities/line:
    $ref: "./paths/me.yml#/lineIdentity"

  /me/password:
    $ref: "./paths/me.yml#/password"

  /me/skill-levels:
    $ref: "./paths/me.yml#/skillLevels"

  /me/skill-levels/{sport_id}:
    $ref: "./paths/me.yml#/sportSkillLevel"

  /me/skill-ratings:
    $ref: "./paths/skill_ratings.yml#/mySkillRatings"

  # ============================
  # Users (System Admin)
  # ============================
  /users:
    $ref: "./paths/users.yml#/listUsers"

  /users/{id}:
    $ref: "./paths/users.yml#/userDetail"

  /users/{id}/avatar:
    $ref: "./paths/users.yml#/avatarUpload"

  /users/{id}/skill-ratings:
    $ref: "./paths/skill_ratings.yml#/userSkillRatings"

  # ============================
  # Organizations
  # ============================
  /organizations:
    $ref: "./paths/organizations.yml#/listOrganizations"

  /organizations/{id}:
    $ref: "./paths/organizations.yml#/organizationDetail"

  /organizations/{id}/cover:
    $ref: "./paths/organizations.yml#/coverUpload"

  # ============================
  # Members
  # ============================
  /organizations/{id}/members:
    $ref: "./paths/members.yml#/listMembers"

  /organizations/{id}/members/{user_id}:
    $ref: "./paths/members.yml#/removeMember"

  # ============================
  # Managers
  # ============================
  /organizations/{id}/managers:
    $ref: "./paths/managers.yml#/listManagers"

  /organizations/{id}/managers/{user_id}:
    $ref: "./paths/managers.yml#/removeManager"

  # ============================
  # Locations
  # ============================
  /locations:
    $ref: "./paths/locations.yml#/listLocations"

  /locations/{id}:
    $ref: "./paths/locations.yml#/locationDetail"

  /locations/{id}/availability:
    $ref: "./paths/bookings.yml#/locationAvailability"

  /locations/{id}/cover:
    $ref: "./paths/locations.yml#/uploadCover"

  # ============================
  # Location Managers
  # ============================
  /locations/{id}/managers:
    $ref: "./paths/locations.yml#/locationManagers"

  /locations/{id}/managers/{user_id}:
    $ref: "./paths/locations.yml#/removeLocationManager"

  # ============================
  # Resources
  # ============================
  /resources:
    $ref: "./paths/resources.yml#/listResources"

  /resources/{id}:
    $ref: "./paths/resources.yml#/resourceDetail"

  /resources/{id}/cover:
    $ref: "./paths/resources.yml#/resourceCoverUpload"

  /resources/{id}/availability:
    $ref: "./paths/resources.yml#/resourceAvailability"

  # ============================
  # Bookings
  # ============================
  /bookings:
    $ref: "./paths/bookings.yml#/listBookings"

  /bookings/{id}:
    $ref: "./paths/bookings.yml#/bookingDetail"

  /booking-series:
    $ref: "./paths/bookings.yml#/createBookingSeries"

  /booking-series/{id}:
    $ref: "./paths/bookings.yml#/bookingSeriesDetail"

  # ============================
  # Announcements
  # ============================
  /announcements:
    $ref: "./paths/announcements.yml#/listAnnouncements"

  /announcements/{id}:
    $ref: "./paths/announcements.yml#/announcementDetail"

  # ============================
  # Files (Login Required)
  # ============================
  /files/{id}:
    $ref: "./paths/files.yml#/serveFile"

  /files/{id}/thumbnail:
    $ref: "./paths/files.yml#/serveThumbnail"

  # ============================
  # Sports (Public read, System Admin write)
  # ============================
  /sports:
    $ref: "./paths/sports.yml#/sports"

  /sports/{id}:
    $ref: "./paths/sports.yml#/sportDetail"

  # ============================
  # Skill Levels (Public read, System Admin write)
  # ============================
  /skill-levels:
    $ref: "./paths/skill_levels.yml#/skillLevels"

  /skill-levels/{id}:
    $ref: "./paths/skill_levels.yml#/skillLevelDetail"

  # ============================
  # Pickup Groups
  # ============================
  /pickup-groups:
    $ref: "./paths/pickup.yml#/pickupGroups"

  /pickup-groups/{id}:
    $ref: "./paths/pickup.yml#/pickupGroupDetail"

  /pickup-groups/{id}/orders:
    $ref: "./paths/pickup.yml#/pickupGroupOrders"

  /pickup-groups/{id}/notifications:
    $ref: "./paths/pickup.yml#/pickupGroupNotifications"

  /pickup-groups/{id}/host-messages:
    $ref: "./paths/pickup.yml#/pickupGroupHostMessages"

  /pickup-group-series:
    $ref: "./paths/pickup.yml#/pickupGroupSeries"

  /pickup-groups/{id}/orders/{order_id}/absence:
    $ref: "./paths/pickup.yml#/pickupOrderAbsence"

  /users/{id}/pickup-stats:
    $ref: "./paths/pickup.yml#/userPickupStats"

  /pickup-groups/{id}/party-orders:
    $ref: "./paths/pickup.yml#/pickupGroupPartyOrders"

  /pickup-groups/{id}/participant-stats:
    $ref: "./paths/pickup.yml#/pickupGroupParticipantStats"

  /pickup-groups/{id}/ratings:
    $ref: "./paths/skill_ratings.yml#/groupRatings"

  /pickup-groups/{id}/ratings/{user_id}:
    $ref: "./paths/skill_ratings.yml#/groupRatingDetail"

  /hosts/{host_id}/pickup-groups:
    $ref: "./paths/pickup.yml#/hostPickupGroups"

  # ============================
  # Pickup Orders
  # ============================
  /pickup-orders:
    $ref: "./paths/pickup.yml#/pickupOrders"

  /pickup-orders/{id}:
    $ref: "./paths/pickup.yml#/pickupOrderDetail"

  # ============================
  # Pickup Hosts (System Admin)
  # ============================
  /pickup-hosts:
    $ref: "./paths/pickup_hosts.yml#/pickupHosts"

  /pickup-hosts/{id}:
    $ref: "./paths/pickup_hosts.yml#/pickupHostDetail"

  # ============================
  # Favorites
  # ============================
  /favorites/host:
    $ref: "./paths/favorites.yml#/favoriteHosts"

  # ============================
  # Notifications
  # ============================
  /notifications:
    $ref: "./paths/notifications.yml#/notifications"

  /notifications/unread-count:
    $ref: "./paths/notifications.yml#/unreadCount"

  /notifications/read-all:
    $ref: "./paths/notifications.yml#/readAll"

  /notifications/{id}/read:
    $ref: "./paths/notifications.yml#/markRead"

  # ============================
  # Coaches & Coach Groups
  # ============================
  /coach-applications:
    $ref: "./paths/coach.yml#/coachApplications"

  /coaches:
    $ref: "./paths/coach.yml#/coaches"

  /coaches/me:
    $ref: "./paths/coach.yml#/coachMe"

  /coaches/me/group:
    $ref: "./paths/coach.yml#/myCoachGroup"

  /coaches/me/invitations:
    $ref: "./paths/coach.yml#/myCoachInvitations"

  /coaches/{id}:
    $ref: "./paths/coach.yml#/coachDetail"

  /admin/coach-applications:
    $ref: "./paths/coach.yml#/adminCoachApplications"

  /admin/coach-applications/{id}/review:
    $ref: "./paths/coach.yml#/adminCoachApplicationReview"

  /coach-groups:
    $ref: "./paths/coach.yml#/coachGroups"

  /coach-groups/{id}:
    $ref: "./paths/coach.yml#/coachGroupDetail"

  /coach-groups/{id}/invitations:
    $ref: "./paths/coach.yml#/coachGroupInvitations"

  /coach-groups/{id}/invitations/{invitation_id}:
    $ref: "./paths/coach.yml#/coachGroupInvitationDetail"

  /coach-groups/{id}/members/{user_id}:
    $ref: "./paths/coach.yml#/coachGroupMember"

  /coach-invitations/{id}/accept:
    $ref: "./paths/coach.yml#/acceptCoachInvitation"

  /coach-invitations/{id}/decline:
    $ref: "./paths/coach.yml#/declineCoachInvitation"

  # ============================
  # Courses & Enrollments
  # ============================
  /courses:
    $ref: "./paths/course.yml#/courses"

  /courses/{id}:
    $ref: "./paths/course.yml#/courseDetail"

  /courses/{id}/sessions:
    $ref: "./paths/course.yml#/courseSessions"

  /courses/{id}/sessions/{session_id}:
    $ref: "./paths/course.yml#/courseSessionDetail"

  /courses/{id}/enrollments:
    $ref: "./paths/course.yml#/courseEnrollments"

  /enrollments:
    $ref: "./paths/course.yml#/myEnrollments"

  /enrollments/{id}:
    $ref: "./paths/course.yml#/enrollmentDetail"

  /enrollments/{id}/payment:
    $ref: "./paths/payment.yml#/enrollmentPayment"

  /enrollments/{id}/transfer-reports:
    $ref: "./paths/payment.yml#/enrollmentTransferReports"

  /transfer-reports:
    $ref: "./paths/payment.yml#/transferReports"

  /transfer-reports/{id}/review:
    $ref: "./paths/payment.yml#/transferReportReview"

  /enrollments/{id}/cancellation-requests:
    $ref: "./paths/payment.yml#/enrollmentCancellations"

  /cancellation-requests:
    $ref: "./paths/payment.yml#/cancellations"

  /cancellation-requests/{id}/resolve:
    $ref: "./paths/payment.yml#/cancellationResolve"

  /sessions/{id}/leave-requests:
    $ref: "./paths/attendance.yml#/sessionLeave"

  /sessions/{id}/attendance:
    $ref: "./paths/attendance.yml#/sessionAttendance"

  /leave-requests/{id}:
    $ref: "./paths/attendance.yml#/leaveDetail"

  /leave-requests/{id}/makeup-options:
    $ref: "./paths/attendance.yml#/makeupOptions"

  /leave-requests/{id}/makeup-selection:
    $ref: "./paths/attendance.yml#/makeupSelection"

  /enrollments/{id}/attendance:
    $ref: "./paths/attendance.yml#/enrollmentAttendance"

  # ============================
  # Reviews, Complaints, Reputation, Suspensions
  # ============================
  /enrollments/{id}/review:
    $ref: "./paths/trust.yml#/enrollmentReview"

  /coaches/{id}/reviews:
    $ref: "./paths/trust.yml#/coachReviews"

  /complaints:
    $ref: "./paths/trust.yml#/complaints"

  /complaints/{id}:
    $ref: "./paths/trust.yml#/complaintDetail"

  /admin/reviews:
    $ref: "./paths/trust.yml#/adminReviews"

  /admin/reviews/{id}:
    $ref: "./paths/trust.yml#/adminReviewDetail"

  /admin/complaints:
    $ref: "./paths/trust.yml#/adminComplaints"

  /admin/complaints/{id}:
    $ref: "./paths/trust.yml#/adminComplaintDetail"

  /admin/complaints/{id}/notes:
    $ref: "./paths/trust.yml#/adminComplaintNotes"

  /admin/coaches/{id}/reputation:
    $ref: "./paths/trust.yml#/adminReputation"

  /admin/coaches/{id}/reputation-events:
    $ref: "./paths/trust.yml#/adminReputationEvents"

  /admin/coaches/{id}/suspensions:
    $ref: "./paths/trust.yml#/adminSuspensions"

  /admin/suspensions/{id}/lift:
    $ref: "./paths/trust.yml#/adminSuspensionLift"

  # ============================
  # Shared / Common Schemas for Reference
  # ============================
  # (The models defined under components/schemas are referenced above)
