UserResponse:
  type: object
  properties:
    id:
      type: string
      format: uuid
    email:
      type: string
      format: email
    username:
      type: string
      description: "唯一帳號代稱 (小寫英文、數字、底線，4-15 字)。目前不可修改。"
    display_name:
      type: string
      nullable: true
    avatar:
      type: string
      format: uri
      nullable: true
    avatar_thumbnail:
      type: string
      format: uri
      nullable: true
    created_at:
      type: string
      format: date-time
    last_login_at:
      type: string
      format: date-time
      nullable: true
    phone:
      type: string
      nullable: true
    gender:
      type: string
      enum: [male, female, other]
      nullable: true
      description: "性別 (選填)"
    birth_date:
      type: string
      format: date
      nullable: true
      description: "出生年月日 YYYY-MM-DD (選填)。僅本人與系統管理員可見。"
    age:
      type: integer
      nullable: true
      description: "由 birth_date 推算的足歲；未提供 birth_date 時為 null"
    is_active:
      type: boolean
    is_system_admin:
      type: boolean
    is_pickup_host:
      type: boolean
      description: "是否具有球團主辦人 (pickup host) 身分"
    organizations:
      type: array
      description: The list of organizations the user belongs to
      items:
        $ref: "./organization.yml#/OrganizationBrief"
  required:
    - id
    - email
    - username
    - created_at
    - is_active
    - is_system_admin
    - is_pickup_host
    - organizations

MeResponse:
  type: object
  description: 包裝 User 物件的回應格式
  properties:
    user:
      $ref: "#/UserResponse"
  required:
    - user

RegisterRequest:
  type: object
  properties:
    email:
      type: string
      format: email
    username:
      type: string
      pattern: "^[a-z0-9_]{4,15}$"
      description: "唯一帳號代稱 (小寫英文、數字、底線，4-15 字)。大寫會自動轉為小寫。"
    password:
      type: string
      minLength: 8
    display_name:
      type: string
    gender:
      type: string
      enum: [male, female, other]
      description: "選填"
    birth_date:
      type: string
      format: date
      description: "選填。YYYY-MM-DD，不可為未來日期，且不早於 1900-01-01。"
  required:
    - email
    - username
    - password
    - display_name

LoginRequest:
  type: object
  properties:
    email:
      type: string
      format: email
    password:
      type: string
  required:
    - email
    - password

LoginResponse:
  type: object
  properties:
    access_token:
      type: string
    user:
      $ref: "#/UserResponse"
  required:
    - access_token
    - user

UpdateUserRequest:
  type: object
  properties:
    display_name:
      type: string
    phone:
      type: string
    gender:
      type: string
      enum: [male, female, other]
    birth_date:
      type: string
      format: date
    is_active:
      type: boolean
    is_system_admin:
      type: boolean

# PATCH /me：使用者修改自己的個人資料。不含 is_active / is_system_admin 等管理欄位。
# 所有欄位皆為選填，只更新有傳的欄位 (無法藉由本 API 清除 gender / birth_date)。
UpdateMeRequest:
  type: object
  properties:
    display_name:
      type: string
      maxLength: 50
    phone:
      type: string
      description: "台灣手機號碼格式"
    gender:
      type: string
      enum: [male, female, other]
    birth_date:
      type: string
      format: date
      description: "YYYY-MM-DD，不可為未來日期，且不早於 1900-01-01。"

UserTag:
  type: object
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
  required:
    - id
    - name

AddPickupHostRequest:
  type: object
  description: "授予使用者球團主辦人 (pickup host) 身分"
  properties:
    user_id:
      type: string
      format: uuid
  required:
    - user_id
