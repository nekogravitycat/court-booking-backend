ManagerResponse:
  type: object
  properties:
    id:
      type: string
      format: uuid
    email:
      type: string
      nullable: true
    display_name:
      type: string
      nullable: true
    created_at:
      type: string
      format: date-time
    is_active:
      type: boolean
  required:
    - id
    - created_at
    - is_active

AddOrganizationManagerRequest:
  type: object
  properties:
    user_id:
      type: string
      format: uuid
  required:
    - user_id

AddMemberRequest:
  type: object
  description: "email 與 username 擇一提供（兩者都給或都不給回 400）。以 LINE 註冊且沒有 email 的使用者請用 username。"
  properties:
    email:
      type: string
      format: email
      description: Email address of the user to add as a member
      example: user@example.com
    username:
      type: string
      minLength: 4
      maxLength: 15
      description: Username of the user to add as a member
      example: some_user
