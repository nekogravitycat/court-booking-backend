PickupHostTag:
  type: object
  description: "主辦人資訊，即時取自 users (非快照)。"
  properties:
    id:
      type: string
      format: uuid
    username:
      type: string
    display_name:
      type: string
      nullable: true
    phone:
      type: string
      nullable: true
  required:
    - id
    - username

PickupGroupResponse:
  type: object
  properties:
    id:
      type: string
      format: uuid
    host:
      $ref: "#/PickupHostTag"
    title:
      type: string
    description:
      type: string
      nullable: true
      description: "簡介，最多 100 字。僅 GET /pickup-groups/{id} 會回傳此欄位。"
    start_time:
      type: string
      format: date-time
    end_time:
      type: string
      format: date-time
    fee:
      type: number
    capacity:
      type: integer
    location_id:
      type: string
      format: uuid
    sport:
      $ref: "./sport.yml#/SportTag"
    min_skill_level:
      $ref: "./skilllevel.yml#/SkillLevelTag"
    max_skill_level:
      allOf:
        - $ref: "./skilllevel.yml#/SkillLevelTag"
      nullable: true
      description: "程度上限；null 表示不設上限。"
    status:
      type: string
      enum: [active, cancelled, completed]
    enable:
      type: boolean
      description: "啟用狀態"
    current_enrolled:
      type: integer
      description: "已佔用的名額數 = 各有效訂單 (非 cancelled / rejected) 的 party_size 加總；多人報名一張訂單佔多個名額。"
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
  required:
    - id
    - host
    - title
    - start_time
    - end_time
    - fee
    - capacity
    - location_id
    - sport
    - min_skill_level
    - max_skill_level
    - status
    - enable
    - current_enrolled
    - created_at
    - updated_at

PickupGroupDetailResponse:
  allOf:
    - $ref: "#/PickupGroupResponse"
    - type: object
      properties:
        orders:
          type: array
          items:
            $ref: "#/PickupOrderResponse"

# 精簡的公開列表項目，用於 GET /pickup-groups 與 GET /hosts/{host_id}/pickup-groups。
# 不含主辦人電話等敏感資訊。
PickupGroupBrief:
  type: object
  properties:
    id:
      type: string
      format: uuid
    host_id:
      type: string
      format: uuid
    host_username:
      type: string
    host_display_name:
      type: string
      nullable: true
    location_id:
      type: string
      format: uuid
    title:
      type: string
    sport:
      $ref: "./sport.yml#/SportTag"
    min_skill_level:
      $ref: "./skilllevel.yml#/SkillLevelTag"
    max_skill_level:
      allOf:
        - $ref: "./skilllevel.yml#/SkillLevelTag"
      nullable: true
      description: "程度上限；null 表示不設上限。"
    start_time:
      type: string
      format: date-time
    fee:
      type: number
    enrolled_status:
      type: string
      enum: [free, pending, confirmed, cancelled, cancel_request, rejected]
      description: |
        呼叫者對此臨打團的狀態。未登入或未報名時為 free；
        已報名時反映該使用者訂單的實際狀態。rejected 表示已被主辦人拒絕，無法再次報名。
    distance_km:
      type: number
      format: double
      nullable: true
      description: "使用者座標 (latitude/longitude 查詢參數) 到場地的距離，公里；未提供座標時為 null"
  required:
    - id
    - host_id
    - host_username
    - location_id
    - title
    - sport
    - min_skill_level
    - max_skill_level
    - start_time
    - fee
    - enrolled_status

CreatePickupGroupRequest:
  type: object
  properties:
    title:
      type: string
    description:
      type: string
      nullable: true
      maxLength: 100
      description: "簡介 (球種、場地面數等細項)，最多 100 字。"
    start_time:
      type: string
      format: date-time
    end_time:
      type: string
      format: date-time
    fee:
      type: number
    capacity:
      type: integer
    location_id:
      type: string
      format: uuid
      description: "場地 ID (關聯至 Location)"
    sport_id:
      type: string
      format: uuid
      description: "球類 ID (關聯至 Sport)"
    min_skill_level:
      type: integer
      minimum: 1
      description: "程度下限，必填。必須是所選 sport_id 對照表 (GET /skill-levels) 已定義且啟用的程度。"
    max_skill_level:
      type: integer
      minimum: 1
      nullable: true
      description: "程度上限，可省略 (不設上限)。若提供，須為對照表已定義且啟用的程度，且不可小於 min_skill_level (400)。"
    enable:
      type: boolean
      default: true
      description: "啟用狀態"
  required:
    - title
    - start_time
    - end_time
    - fee
    - capacity
    - location_id
    - sport_id
    - min_skill_level

UpdatePickupGroupRequest:
  type: object
  properties:
    title:
      type: string
    description:
      type: string
      nullable: true
      maxLength: 100
      description: "簡介 (球種、場地面數等細項)，最多 100 字。"
    start_time:
      type: string
      format: date-time
    end_time:
      type: string
      format: date-time
    fee:
      type: number
    capacity:
      type: integer
    location_id:
      type: string
      format: uuid
    sport_id:
      type: string
      format: uuid
    min_skill_level:
      type: integer
      minimum: 1
      description: "程度下限；一旦設定不可清空為 null。若變更 sport_id、min_skill_level 或 max_skill_level，程度範圍仍須在該球類對照表中已定義且啟用，且 max_skill_level 不可小於 min_skill_level。"
    max_skill_level:
      type: integer
      minimum: 1
      nullable: true
      description: "程度上限，可省略保持不變；一旦設定則暫不支援再次清空為 null。"
    status:
      type: string
      enum: [active, cancelled, completed]
    enable:
      type: boolean

PickupOrderResponse:
  type: object
  properties:
    id:
      type: string
      format: uuid
    pickup_group_id:
      type: string
      format: uuid
    user_id:
      type: string
      format: uuid
    booker_name:
      type: string
    booker_phone:
      type: string
      nullable: true
    skill_level:
      type: integer
      description: "報名時從帳號設定取得的程度快照 (整數)。多人報名時為揪團主 (members 第一筆) 的帳號程度。後續修改帳號不影響快照。"
    party_size:
      type: integer
      description: "此訂單佔用的名額數；單人報名為 1"
    members:
      type: array
      description: "多人報名的每個座位 (含揪團主)；單人報名時省略此欄位"
      items:
        allOf:
          - $ref: "#/PartyMember"
          - required: [skill_level]
    status:
      type: string
      enum: [pending, confirmed, cancelled, cancel_request, rejected]
      description: "報名生命週期狀態。rejected 由主辦人設定 (拒絕報名)，不計入 current_enrolled，且該使用者無法再次報名。"
    payment_status:
      type: string
      enum: [done, pending, failed]
      description: "付款狀態"
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
  required:
    - id
    - pickup_group_id
    - user_id
    - booker_name
    - skill_level
    - party_size
    - status
    - payment_status
    - created_at
    - updated_at

CreatePickupOrderRequest:
  type: object
  description: "單人報名不需 body。程度取自帳號設定；舊客戶端提供的 skill_level 會被忽略。"

PartyMember:
  type: object
  description: "多人報名的一個座位。第一筆為本人，skill_level 可省略且會由帳號設定覆蓋；其他同行者匿名，必須提供 skill_level。"
  properties:
    gender:
      type: string
      enum: [male, female, other]
    skill_level:
      type: integer
      minimum: 1
  required:
    - gender

CreatePartyOrderRequest:
  type: object
  properties:
    organizer_name:
      type: string
      maxLength: 50
      description: "揪團主名稱，會存成訂單的 booker_name"
    party_size:
      type: integer
      minimum: 2
      maximum: 50
      description: "揪團總人數 (含揪團主)，佔用同樣數量的名額"
    members:
      type: array
      minItems: 2
      maxItems: 50
      description: "每個座位的性別與程度；含揪團主本人，放第一筆。長度須等於 party_size。"
      items:
        $ref: "#/PartyMember"
  required:
    - organizer_name
    - party_size
    - members

UpdatePickupOrderRequest:
  type: object
  description: |
    status 與 payment_status 至少需提供一個。
    - status：報名者本人僅能將自己的訂單改為 cancelled 或 cancel_request；
      group host 或系統管理員可設定任意值（審核用途），包含 rejected（拒絕報名）。
    - rejected：僅 group host 或系統管理員可設定；被拒絕的使用者無法再次報名同一團，
      且該訂單不計入 current_enrolled。
    - payment_status：僅 group host 或系統管理員可變更。
  properties:
    status:
      type: string
      enum: [pending, confirmed, cancelled, cancel_request, rejected]
    payment_status:
      type: string
      enum: [done, pending, failed]

# GET /pickup-groups 與 GET /hosts/{host_id}/pickup-groups 的分頁回應 (精簡欄位)。
PickupGroupBriefPageResponse:
  allOf:
    - $ref: "./common.yml#/PageResponse"
    - type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/PickupGroupBrief"

PickupGroupPageResponse:
  allOf:
    - $ref: "./common.yml#/PageResponse"
    - type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/PickupGroupResponse"

ParticipantStatsResponse:
  type: object
  description: "已報名座位 (pending + confirmed) 的匿名統計"
  properties:
    total:
      type: integer
      description: "座位總數 (多人報名每人一個座位)"
    genders:
      type: array
      description: "固定依序包含 male / female / other / unknown"
      items:
        type: object
        properties:
          gender:
            type: string
            enum: [male, female, other, unknown]
          count:
            type: integer
        required: [gender, count]
    age_groups:
      type: array
      description: "固定依序包含 under_18 / 18_24 / 25_34 / 35_44 / 45_54 / 55_plus / unknown"
      items:
        type: object
        properties:
          age_group:
            type: string
            enum: [under_18, 18_24, 25_34, 35_44, 45_54, 55_plus, unknown]
          count:
            type: integer
        required: [age_group, count]
    skill_levels:
      type: array
      description: "依程度由低到高；包含該球類對照表所有程度 (人數可為 0)"
      items:
        type: object
        properties:
          level:
            type: integer
          label:
            type: string
          count:
            type: integer
        required: [level, label, count]
  required:
    - total
    - genders
    - age_groups
    - skill_levels
