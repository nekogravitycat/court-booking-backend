LocationResponse:
  type: object
  properties:
    id:
      type: string
      format: uuid
    organization:
      $ref: "./organization.yml#/OrganizationTag"
    name:
      type: string
    created_at:
      type: string
      format: date-time
    capacity:
      type: integer
      format: int64
    opening_hours_start:
      type: string
      description: "Format: HH:MM:SS"
      example: "09:00:00"
    opening_hours_end:
      type: string
      description: "Format: HH:MM:SS"
      example: "22:00:00"
    location_info:
      type: string
    opening:
      type: boolean
    rule:
      type: string
    facility:
      type: string
    description:
      type: string
    longitude:
      type: number
      format: double
    latitude:
      type: number
      format: double
    parking_name:
      type: string
      nullable: true
      description: "停車場名稱。parking_name / parking_latitude / parking_longitude 三者要嘛全有、要嘛全為 null。"
    parking_latitude:
      type: number
      format: double
      nullable: true
    parking_longitude:
      type: number
      format: double
      nullable: true
    cover:
      type: string
      description: "URL to cover image (e.g., /files/{file-id})"
      example: "/files/a1b2c3d4-e5f6-7890-abcd-ef1234567890"
      nullable: true
    cover_thumbnail:
      type: string
      description: "URL to cover thumbnail (e.g., /files/{file-id}/thumbnail)"
      example: "/files/a1b2c3d4-e5f6-7890-abcd-ef1234567890/thumbnail"
      nullable: true
    minimum_booking_notice_minutes:
      type: integer
      minimum: 0
      default: 0
      description: "一般預約的最短提前時間 (分鐘)。開始時間須 >= 現在 + 此值。不影響 Booking Series。"
    maximum_booking_advance_days:
      type: integer
      minimum: 1
      maximum: 90
      default: 90
      description: "一般預約最遠可預約天數 (上限 90)。minimum_booking_notice_minutes 不得超過此值換算的分鐘數。不影響 Booking Series。"
  required:
    - id
    - organization
    - name
    - opening_hours_start
    - opening_hours_end
    - longitude
    - latitude

CreateLocationRequest:
  type: object
  properties:
    organization_id:
      type: string
      format: uuid
    name:
      type: string
    capacity:
      type: integer
      format: int64
    opening_hours_start:
      type: string
      pattern: "^([0-1]?[0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$"
      example: "09:00:00"
    opening_hours_end:
      type: string
      pattern: "^([0-1]?[0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$"
      example: "22:00:00"
    location_info:
      type: string
    opening:
      type: boolean
    rule:
      type: string
    facility:
      type: string
    description:
      type: string
    longitude:
      type: number
      minimum: -180
      maximum: 180
    latitude:
      type: number
      minimum: -90
      maximum: 90
    parking_name:
      type: string
      maxLength: 100
      description: "選填。停車場名稱、緯度、經度須三者一起提供 (否則 400)。"
    parking_latitude:
      type: number
      minimum: -90
      maximum: 90
    parking_longitude:
      type: number
      minimum: -180
      maximum: 180
    minimum_booking_notice_minutes:
      type: integer
      minimum: 0
      default: 0
      description: "一般預約的最短提前時間 (分鐘)。開始時間須 >= 現在 + 此值。不影響 Booking Series。"
    maximum_booking_advance_days:
      type: integer
      minimum: 1
      maximum: 90
      default: 90
      description: "一般預約最遠可預約天數 (上限 90)。minimum_booking_notice_minutes 不得超過此值換算的分鐘數。不影響 Booking Series。"
  required:
    - organization_id
    - name
    - capacity
    - opening_hours_start
    - opening_hours_end
    - location_info
    - longitude
    - latitude

UpdateLocationRequest:
  type: object
  properties:
    name:
      type: string
    capacity:
      type: integer
    opening_hours_start:
      type: string
    opening_hours_end:
      type: string
    location_info:
      type: string
    opening:
      type: boolean
    rule:
      type: string
    facility:
      type: string
    description:
      type: string
    latitude:
      type: number
    longitude:
      type: number
    parking_name:
      type: string
      maxLength: 100
    parking_latitude:
      type: number
      minimum: -90
      maximum: 90
    parking_longitude:
      type: number
      minimum: -180
      maximum: 180
    remove_parking:
      type: boolean
      description: "設為 true 會清除整組停車場資訊；不可與 parking_* 欄位同時提供 (400)。三個 parking_* 欄位都不傳則維持不變。"
    minimum_booking_notice_minutes:
      type: integer
      minimum: 0
      default: 0
      description: "一般預約的最短提前時間 (分鐘)。開始時間須 >= 現在 + 此值。不影響 Booking Series。"
    maximum_booking_advance_days:
      type: integer
      minimum: 1
      maximum: 90
      default: 90
      description: "一般預約最遠可預約天數 (上限 90)。minimum_booking_notice_minutes 不得超過此值換算的分鐘數。不影響 Booking Series。"

LocationTag:
  type: object
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
  required:
    - id
    - name
