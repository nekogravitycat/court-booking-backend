      - name: fee_max
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
        description: "費用上限 (含)；不可小於 fee_min (400)"
      - name: followed_only
        in: query
        required: false
        schema:
          type: boolean
        description: "只顯示我追蹤的教練 (主辦人) 的臨打團。需帶有效 Token，否則 401。"
      - name: latitude
        in: query
        required: false
        schema:
          type: number
          minimum: -90
          maximum: 90
        description: "使用者所在緯度。須與 longitude 一起提供；提供後每筆會回傳 distance_km。"
      - name: longitude
        in: query
        required: false
        schema:
          type: number
          minimum: -180
          maximum: 180
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
          enum: [start_time, created_at, min_skill_level, max_skill_level, distance]
          default: start_time
        description: |
          排序欄位。distance 依「使用者座標到場地」的球面距離排序，必須同時提供 latitude 與 longitude (否則 400)。
      - name: sort_order
        in: query
