pickupOrders:
  get:
    tags:
      - Pickup Orders
    summary: "取得該使用者自己送出的所有訂單"
    description: |
      列出該使用者自己送出的所有訂單。
      
      **權限 Access Control**:
      - **Login Required**: 任何已登入的使用者皆可存取。
    security:
      - bearerAuth: []
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../components/schemas/pickup.yml#/PickupOrderResponse"

pickupGroupPartyOrders:
  post:
    tags:
      - Pickup Orders
    summary: "多人報名 (一張訂單佔多個名額)"
    description: |
      由登入者 (揪團主) 一次替整團報名。訂單佔 party_size 個名額，整團必須放得進剩餘名額，
      否則 409 (group is fully booked)。

      - members 為每一個座位 (**含揪團主本人，放在第一筆**)，長度必須等於 party_size。
      - 本人的 skill_level 可省略，伺服器會從帳號設定讀取並覆蓋第一筆；尚未設定回傳 400。
      - 其他同行者仍須提供該運動已定義且啟用的 skill_level。全部程度保存為報名快照。
      - 成員不需要帳號，僅記錄性別與程度，會併入報名統計；**不適用未來的評分系統**。
      - organizer_name 會存成訂單的 booker_name。
      - 其餘規則同單人報名：同一使用者對同一團只能有一張訂單 (409)、時段衝突回 409 time_conflict、
        被拒絕過不可再報名、曾取消者可重新報名 (原訂單被重置，成員會被整批取代)。

      **權限 Access Control**:
      - **Login Required**: 任何已登入的使用者皆可存取。
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/pickup.yml#/CreatePartyOrderRequest"
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: "../components/schemas/pickup.yml#/PickupOrderResponse"
      "400":
        description: "party_size 不在 2~50、members 數量不符、gender 不合法、或程度未在該球類對照表中定義"
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/ErrorResponse"
      "409":
        description: "名額不足、已報名、或時段衝突 (time_conflict)"
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/ErrorResponse"

pickupGroupParticipantStats:
  get:
    tags:
      - Pickup Groups
    summary: "取得已報名者的匿名統計 (公開)"
    description: |
      回傳該團目前已報名座位 (訂單狀態為 pending 與 confirmed) 的匿名統計：性別比、年齡分級、程度分佈。
      多人報名的每個成員各算一個座位。**只回傳人數，不含任何身分資訊。**

      - 性別、年齡來自報名者的個人資料；沒填的計入 unknown。多人報名的成員沒有年齡，計入 age_group=unknown。
      - 年齡以場地所在時區的今天計算；分級為 under_18 / 18_24 / 25_34 / 35_44 / 45_54 / 55_plus / unknown。
      - 程度為報名時**自填**的整數；skill_levels 會列出該球類對照表的所有程度 (人數可為 0)，
        以及任何出現在資料中但對照表已無的程度 (label 為空字串)。

      **權限 Access Control**:
      - **Public**: 無需登入即可存取。
    security: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "../components/schemas/pickup.yml#/ParticipantStatsResponse"
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/ErrorResponse"
