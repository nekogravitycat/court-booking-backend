        required: false
        schema:
          type: integer
          minimum: 1
        description: "篩選下限：只列出程度範圍與 [min_skill_level, max_skill_level] 有重疊的臨打團。"
      - name: max_skill_level
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: "篩選上限，可與 min_skill_level 搭配使用；不可小於 min_skill_level (400)。"
      - name: fee_min
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
