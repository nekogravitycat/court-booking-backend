pickupGroups:
  get:
    tags:
      - Pickup Groups
    summary: "取得公開的臨打團列表 (公開，選擇性登入)"
    description: |
      取得目前公開的臨打團清單（status=active、enable=true 且尚未結束）。
      已額滿的臨打團仍會列出（僅無法再報名），方便使用者瀏覽。
      回傳精簡欄位：主辦人 (id / username / display_name)、位置、球團名稱、球類、程度、
      開始時間、費用，以及 enrolled_status。
      帶座標時另含 distance_km。

      **篩選與排序**：sport_id、min_skill_level / max_skill_level (程度範圍)、fee_min / fee_max (價位)、
      followed_only (只看追蹤的教練)；
      sort_by 可選 start_time / created_at / min_skill_level / max_skill_level / distance。

      **選擇性登入**：帶有有效 Bearer Token 時，enrolled_status 會反映該使用者對每個
      臨打團的訂單狀態；未登入則一律為 free。

      **權限 Access Control**:
      - **Public**: 無需登入即可存取。
    security:
      - {}
      - bearerAuth: []
    parameters:
      - name: sport_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: min_skill_level
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: "篩選下限：只列出程度範圍與 [min_skill_level, max_skill_level] 有重疊的臨打團。"
      - name: max_skill_level
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: "篩選上限，可與 min_skill_level 搭配使用；不可小於 min_skill_level (400)。"
      - name: fee_min
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
        description: "費用下限 (含)"
      - name: fee_max
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
        description: "費用上限 (含)；不可小於 fee_min (400)"
      - name: followed_only
        in: query
        required: false
        schema:
          type: boolean
        description: "只顯示我追蹤的教練 (主辦人) 的臨打團。需帶有效 Token，否則 401。"
      - name: latitude
        in: query
        required: false
        schema:
          type: number
          minimum: -90
          maximum: 90
        description: "使用者所在緯度。須與 longitude 一起提供；提供後每筆會回傳 distance_km。"
      - name: longitude
        in: query
        required: false
        schema:
          type: number
          minimum: -180
          maximum: 180
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
          enum: [start_time, created_at, min_skill_level, max_skill_level, distance]
          default: start_time
        description: |
          排序欄位。distance 依「使用者座標到場地」的球面距離排序，必須同時提供 latitude 與 longitude (否則 400)。
      - name: sort_order
        in: query
        required: false
        schema:
          type: string
          enum: [asc, desc]
        description: "預設：distance 為 asc (最近優先)，其餘為 desc。"
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "../components/schemas/pickup.yml#/PickupGroupBriefPageResponse"
  post:
    tags:
      - Pickup Groups
    summary: "建立新的臨打團 (登入使用者)"
    description: |
      建立新的臨打團。host_id 直接由 JWT Token 解析得出。

      **權限 Access Control**:
      - **Login Required**: 任何已登入且啟用的使用者可建立，不需 pickup host 身分。
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/pickup.yml#/CreatePickupGroupRequest"
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: "../components/schemas/pickup.yml#/PickupGroupResponse"

pickupGroupDetail:
  get:
    tags:
      - Pickup Groups
    summary: "取得單一臨打團詳細資訊"
    description: |
      包含 current_enrolled，並選擇性夾帶該團的所有訂單明細。
      current_enrolled 為已佔用名額數 (多人報名的訂單依 party_size 計算)。
      
      **權限 Access Control**:
      - **Login Required**: 任何已登入的使用者皆可存取。
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "../components/schemas/pickup.yml#/PickupGroupDetailResponse"
  patch:
    tags:
      - Pickup Groups
    summary: "更新臨打團資訊 (主辦人本人或系統管理員)"
    description: |
      更新臨打團資訊（含變更臨打團狀態）。

      **權限 Access Control**:
      - **Group Creator (own group)**: 創建者可更新自己的臨打團，不需 pickup host 身分。
      - **System Admin**: 系統管理員可更新任意臨打團。
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/pickup.yml#/UpdatePickupGroupRequest"
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "../components/schemas/pickup.yml#/PickupGroupResponse"
  delete:
    tags:
      - Pickup Groups
    summary: "刪除臨打團 (僅限系統管理員)"
    description: |
      刪除臨打團。注意：若該臨打團尚有訂單存在，刪除操作將會因資料庫限制而失敗。
      
      **權限 Access Control**:
      - **System Admin Required**: 僅系統管理員身分的使用者可存取。
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: No Content
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/ErrorResponse"

pickupGroupOrders:
  get:
    tags:
      - Pickup Orders
    summary: "取得該臨打團的所有訂單"
    description: |
      列出該 pickup-group 的所有訂單（審核報名成員用途）。

      **權限 Access Control**:
      - **Login Required**: 僅該 pickup-group 主辦人或系統管理員能查看。
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../components/schemas/pickup.yml#/PickupOrderResponse"
  post:
    tags:
      - Pickup Orders
    summary: "新增報名訂單（加入臨打團）"
    description: |
      加入臨打團。user_id 由 JWT Token 解析得出。
      會檢查目前已佔用名額 (各有效訂單 party_size 加總) 加上本次名額是否超過 capacity。
      確保同一使用者不可重複報名同一臨打團。
      同時會檢查該使用者是否已報名其他時段重疊的臨打團，若有衝突則回傳 409
      並帶有 "error": "time_conflict"。

      不需 request body。程度從帳號的該運動設定讀取並保存為訂單快照。
      尚未設定時回傳 400，須先 PUT /me/skill-levels/{sport_id}；運動或程度停用也會回傳 400。
      舊客戶端傳入的 skill_level 會被忽略。修改帳號程度不會影響既有訂單。
      一張單人訂單佔 1 個名額；若要一次替多人報名請用 POST /pickup-groups/{id}/party-orders。

      **權限 Access Control**:
      - **Login Required**: 任何已登入的使用者皆可存取。
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: "../components/schemas/pickup.yml#/PickupOrderResponse"
      "400":
        description: 尚未設定該運動程度，或運動/程度已停用
      "409":
        description: |
          group is fully booked, user already enrolled, or the user already has
          an occupying order for another pickup group whose time range
          overlaps this one (error: "time_conflict").
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/ErrorResponse"

pickupOrderDetail:
  patch:
    tags:
      - Pickup Orders
    summary: "更新訂單狀態"
    description: |
      拆分為 status (報名生命週期) 與 payment_status (付款狀態)。
      只有當 status 為 cancelled 或 rejected 時，該訂單才不再計入 current_enrolled 而釋放名額；
      cancel_request (申請取消中) 仍占用名額，須待真正 cancelled 後才釋放。

      **權限 Access Control**:
      - **Booker (本人)**: 只能將自己的訂單 status 改為 cancelled 或 cancel_request，且不可變更 payment_status。
      - **Group Host / System Admin**: 可設定任意 status 與 payment_status（審核用途）。設定 status=rejected 即拒絕報名者：訂單保留、釋放名額，且該使用者無法再次報名。
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/pickup.yml#/UpdatePickupOrderRequest"
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "../components/schemas/pickup.yml#/PickupOrderResponse"
  delete:
    tags:
      - Pickup Orders
    summary: "硬刪除報名訂單 (僅限系統管理員)"
    description: |
      硬刪除一筆報名訂單。刪除後，原本占用名額的訂單會使該臨打團的
      current_enrolled 自動減去該訂單的 party_size，且該使用者可再次報名該團。

      主辦人請改用 PATCH status=rejected 拒絕報名者：拒絕會保留訂單、釋放名額，
      並使該使用者無法再次報名。

      **權限 Access Control**:
      - **System Admin Only**: 僅系統管理員可硬刪除訂單；主辦人無此權限 (回 403)。
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: No Content
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/ErrorResponse"
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/ErrorResponse"

