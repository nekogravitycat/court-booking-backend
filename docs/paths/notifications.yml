notifications:
  post:
    tags: [Notifications]
    summary: "系統管理員手動發送站內通知"
    description: "僅有效系統管理員可用。一次 1-100 位不重複的有效使用者；全部成功或全部失敗。每位管理員每分鐘最多 10 次成功發送。type 固定為 admin_message，內容為純文字，前端應以文字方式呈現。"
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [user_ids, title, content]
            properties:
              user_ids:
                type: array
                minItems: 1
                maxItems: 100
                uniqueItems: true
                items:
                  type: string
                  format: uuid
              title:
                type: string
                minLength: 1
                maxLength: 100
              content:
                type: string
                minLength: 1
                maxLength: 2000
    responses:
      "201":
        description: "發送成功"
        content:
          application/json:
            schema:
              type: object
              properties:
                sent:
                  type: integer
      "400":
        description: "無效內容、重複收件者或收件者不存在／停用"
      "401":
        description: "未登入"
      "403":
        description: "非系統管理員"
      "429":
        description: "超過發送頻率限制"
  get:
    tags:
      - Notifications
    summary: "取得我的通知 (由新到舊)"
    description: |
      列出目前使用者的站內通知，最新的在前。通知由系統在下列事件自動寫入 (不會推播)：

      | type | 收件者 | 觸發 |
      |------|--------|------|
      | pickup_order_created | 主辦人 | 有人報名 (單人或多人) |
      | pickup_order_confirmed | 報名者 | 主辦人確認報名 |
      | pickup_order_rejected | 報名者 | 主辦人拒絕報名 |
      | pickup_order_cancelled_by_host | 報名者 | 主辦人取消報名 |
      | pickup_payment_updated | 報名者 | 主辦人變更付款狀態 |
      | pickup_order_cancelled | 主辦人 | 報名者取消報名 |
      | pickup_order_cancel_requested | 主辦人 | 報名者申請取消 |
      | pickup_group_cancelled | 已佔名額的報名者 | 臨打團被取消 |
      | pickup_group_updated | 已佔名額的報名者 | 臨打團時間或場地變更 |
      | admin_message | 指定使用者 | 系統管理員手動發送 |
      | skill_rated | 被評分者 | 主辦人為其評定程度 |

      自己的操作不會通知自己。

      **權限 Access Control**:
      - **Login Required**: 只能看到自己的通知。
    security:
      - bearerAuth: []
    parameters:
      - name: unread_only
        in: query
        required: false
        schema:
          type: boolean
        description: "只回傳未讀"
      - $ref: "../components/parameters.yml#/page"
      - $ref: "../components/parameters.yml#/page_size"
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "../components/schemas/notification.yml#/NotificationPageResponse"

unreadCount:
  get:
    tags:
      - Notifications
    summary: "取得未讀通知數"
    description: |
      **權限 Access Control**:
      - **Login Required**
    security:
      - bearerAuth: []
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "../components/schemas/notification.yml#/UnreadCountResponse"

readAll:
  post:
    tags:
      - Notifications
    summary: "全部標為已讀"
    description: |
      **權限 Access Control**:
      - **Login Required**
    security:
      - bearerAuth: []
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: "../components/schemas/notification.yml#/MarkAllReadResponse"

markRead:
  patch:
    tags:
      - Notifications
    summary: "將單則通知標為已讀"
    description: |
      重複標記為冪等 (仍回 204)。通知不存在或不屬於自己時回 404。

      **權限 Access Control**:
      - **Login Required**: 只能操作自己的通知。
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: No Content
      "404":
        description: Not Found
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/ErrorResponse"
