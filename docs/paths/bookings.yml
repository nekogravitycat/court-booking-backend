listBookings:
  get:
    tags:
      - Bookings
    summary: "查詢預約紀錄"
    description: |
      查詢預約紀錄清單。

      **權限 Access Control**:
      - **System Admin**: 可查詢所有預約。
      - **Organization Owner**: 可查詢自己 Organization 下所有 Location 的預約。
      - **Organization Manager**: 可查詢自己 Organization 下所有 Location 的預約，或負責 Location 的預約。
      - **Location Manager**: 可查詢自己負責 Location 的預約。
      - **User**: 僅能查詢自己的預約。
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../components/parameters.yml#/page"
      - $ref: "../components/parameters.yml#/page_size"
      - name: user_id
        in: query
        schema:
          type: string
          format: uuid
        description: "Filter by user (Admin only, or self)"
      - name: resource_id
        in: query
        schema:
          type: string
          format: uuid
        description: \"Filter by resource\"
      - name: organization_id
        in: query
        schema:
          type: string
          format: uuid
        description: \"Filter by organization\"
      - name: status
        in: query
        schema:
          type: string
          enum: [pending, confirmed, cancelled, cancel_request]
      - name: start_time_from
        in: query
        schema:
          type: string
          format: date-time
      - name: start_time_to
        in: query
        schema:
          type: string
          format: date-time
    responses:
      "200":
        description: paged bookings
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas/common.yml#/PageResponse"
                - properties:
                    items:
                      type: array
                      items:
                        $ref: "../components/schemas/booking.yml#/BookingResponse"
  post:
    tags:
      - Bookings
    summary: "新增預約"
    description: |
      建立一筆新的預約。

      **權限 Access Control**:
      - **Login Required**: 任何已登入的使用者皆可存取。
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/booking.yml#/CreateBookingRequest"
    responses:
      "201":
        description: created
        content:
          application/json:
            schema:
              $ref: "../components/schemas/booking.yml#/BookingResponse"
      "400":
        description: Validation error or time invalid
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/ErrorResponse"
      "409":
        description: Conflict (time overlap)
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/ErrorResponse"

bookingDetail:
  get:
    tags:
      - Bookings
    summary: "查詢預約詳情"
    description: |
      取得特定預約的詳細資料。

      **權限 Access Control**:
      - **System Admin**: 完全存取權限。
      - **Organization Owner / Manager**: 可查詢轄下資源的預約。
      - **User**: 僅能查詢自己的預約。
    security:
      - bearerAuth: []
    parameters: &idParams
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: booking details
        content:
          application/json:
            schema:
              $ref: "../components/schemas/booking.yml#/BookingResponse"
      "403":
        description: Forbidden (Not owner or admin)
      "404":
        description: Not found
  patch:
    tags:
      - Bookings
    summary: "修改預約"
    description: |
      更新預約內容或狀態。

      **注意 Note**:
      - **User**: 僅能執行 **取消** (Cancelled)。
      - **Admin / Manager**: 可修改時間或狀態。

      **權限 Access Control**:
      - **System Admin**: 完全存取權限。
      - **Organization Owner / Manager**: 可管理轄下資源的預約。
      - **User**: 僅能取消自己的預約。
    security:
      - bearerAuth: []
    parameters: *idParams
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/booking.yml#/UpdateBookingRequest"
    responses:
      "200":
        description: updated
        content:
          application/json:
            schema:
              $ref: "../components/schemas/booking.yml#/BookingResponse"
      "400":
        description: Invalid status or time range
      "403":
        description: Permission denied
      "409":
        description: Time conflict
  delete:
    tags:
      - Bookings
    summary: "刪除 / 取消預約"
    description: |
      取消或刪除預約 (視實作而定，通常為軟刪除或同 Patch Cancelled)。

      **權限 Access Control**:
      - **System Admin**: 完全存取權限。
      - **Organization Owner / Manager**: 可刪除轄下資源的預約。
      - **User**: 僅能取消自己的預約。
    security:
      - bearerAuth: []
    parameters: *idParams
    responses:
      "204":
        description: deleted
      "403":
        description: Permission denied
      "404":
        description: Not found

createBookingSeries:
  post:
    tags:
      - Bookings
    summary: "建立季租 (Booking Series)"
    description: |
      建立一組固定週期的預約 (3 / 6 / 12 個月)。All-or-nothing：任一 occurrence 衝突或驗證失敗，整個 Series 都不會建立。

      - 每個 occurrence 須符合 Location 營業時間與 30 分鐘對齊，且不得已經開始或位於過去。
      - 不受一般預約的「最多 10 筆 upcoming」、90 天提前上限與 Location booking window 限制。
      - 建立的預約狀態皆為 `pending`。
      - 與既有預約重疊時回傳 `409` 並列出衝突的 occurrences。

      **權限 Access Control**: 沿用一般預約建立權限 (已登入，且組織可營運)。
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/booking.yml#/CreateBookingSeriesRequest"
    responses:
      "201":
        description: created
        content:
          application/json:
            schema:
              $ref: "../components/schemas/booking.yml#/BookingSeriesResponse"
      "400":
        description: Invalid input (term, weekdays, time slot, outside opening hours, past start)
      "404":
        description: Resource not found
      "409":
        description: Conflicting occurrences
        content:
          application/json:
            schema:
              $ref: "../components/schemas/booking.yml#/BookingSeriesConflictResponse"

bookingSeriesDetail:
  get:
    tags:
      - Bookings
    summary: "查詢季租"
    description: |
      **權限 Access Control**: System Admin、Series 擁有者、或該 Organization 的管理者。
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              $ref: "../components/schemas/booking.yml#/BookingSeriesResponse"
      "403":
        description: Permission denied
      "404":
        description: Not found

locationAvailability:
  get:
    tags:
      - Locations
    summary: "查詢 Location 底下所有場地的可用時段"
    description: |
      一次回傳該 Location 所有 Resources 的可預約時段，依 Resource 分組。與 `GET /resources/{id}/availability` 共用同一套計算
      (Location timezone、營業時間、booking window、30 分鐘對齊、已佔用預約)，同一 Resource 結果一致。
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: date
        required: false
        schema:
          type: string
          format: date
        description: 查詢日期 (預設為當日)
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              $ref: "../components/schemas/booking.yml#/LocationAvailabilityResponse"
      "404":
        description: Location not found
