skillLevels:
  get:
    tags: [Me]
    summary: "取得自己的各運動自評程度"
    description: "一次回傳所有已設定的運動（單頁）。包含停用項目；is_active 為運動與程度均啟用時才為 true。與主辦人評分 /me/skill-ratings 分開。"
    operationId: listMySkillLevels
    security:
      - bearerAuth: []
    responses:
      "200":
        description: Account skill levels
        content:
          application/json:
            schema:
              type: object
              required: [items, page, page_size, total]
              properties:
                items:
                  type: array
                  items:
                    $ref: "../components/schemas/user.yml#/SportSkillLevelResponse"
                page:
                  type: integer
                  example: 1
                page_size:
                  type: integer
                total:
                  type: integer
      "401":
        description: Unauthorized

sportSkillLevel:
  get:
    tags: [Me]
    summary: "取得自己的指定運動自評程度"
    operationId: getMySportSkillLevel
    security:
      - bearerAuth: []
    parameters:
      - name: sport_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Account skill level
        content:
          application/json:
            schema:
              $ref: "../components/schemas/user.yml#/SportSkillLevelResponse"
      "400":
        description: UUID 格式錯誤或尚未設定該運動程度
      "401":
        description: Unauthorized
  put:
    tags: [Me]
    summary: "設定或取代自己的指定運動自評程度"
    description: "每個運動各一筆。運動須存在且啟用，skill_level 須為該運動已定義且啟用的程度。只修改本人資料，不影響既有訂單快照或主辦人評分。"
    operationId: setMySportSkillLevel
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [skill_level]
            properties:
              skill_level:
                type: integer
                minimum: 1
                maximum: 100
                example: 2
    parameters:
      - name: sport_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Account skill level saved
        content:
          application/json:
            schema:
              $ref: "../components/schemas/user.yml#/SportSkillLevelResponse"
      "400":
        description: UUID、程度無效或運動停用
      "401":
        description: Unauthorized
      "404":
        description: 運動不存在
  delete:
    tags: [Me]
    summary: "清除自己的指定運動自評程度"
    description: "冪等操作。既有訂單快照不變；再次報名該運動前須重新設定程度。"
    operationId: deleteMySportSkillLevel
    security:
      - bearerAuth: []
    parameters:
      - name: sport_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Cleared (including when already absent)
      "400":
        description: UUID 格式錯誤
      "401":
        description: Unauthorized

me:
  get:
    tags:
      - Me
    summary: "取得目前使用者資訊"
    description: |
      取得當前登入使用者的個人資料。

      **權限 Access Control**:
      - **Login Required**: 任何已登入的使用者皆可存取。
    operationId: getCurrentUser
    security:
      - bearerAuth: []
    responses:
      "200":
        description: Current user profile
        content:
          application/json:
            schema:
              $ref: "../components/schemas/user.yml#/MeResponse"
      "401":
        description: Unauthorized - Token 無效或過期
  patch:
    tags:
      - Me
    summary: "修改自己的個人資料"
    description: |
      使用者修改自己的 display_name、phone、gender、birth_date。
      只更新有傳的欄位；無法透過此 API 修改 is_active / is_system_admin 等管理欄位。

      **權限 Access Control**:
      - **Login Required**: 任何已登入的使用者皆可修改自己的資料。
    operationId: updateCurrentUser
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/user.yml#/UpdateMeRequest"
    responses:
      "200":
        description: Updated user profile
        content:
          application/json:
            schema:
              $ref: "../components/schemas/user.yml#/MeResponse"
      "400":
        description: 欄位格式錯誤 (gender 不在 male/female/other、birth_date 非 YYYY-MM-DD 或為未來日期)
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/ErrorResponse"
      "401":
        description: Unauthorized - Token 無效或過期

lineIdentity:
  post:
    tags:
      - Me
    summary: "綁定 LINE 帳號"
    description: |
      將 LINE 帳號綁定到目前登入的帳號，之後可用 LINE 登入。request body 與 `/auth/line` 相同。
      一個帳號只能綁一個 LINE，一個 LINE 也只能綁一個帳號。不會因 email 相同而自動合併帳號。

      **權限 Access Control**:
      - **Login Required**: 任何已登入的使用者。
    operationId: linkLineIdentity
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/user.yml#/LineAuthRequest"
    responses:
      "200":
        description: 綁定成功 - 回傳更新後的使用者資訊
        content:
          application/json:
            schema:
              $ref: "../components/schemas/user.yml#/MeResponse"
      "400":
        description: Invalid request 或 redirect_uri 不在允許清單內
      "401":
        description: Unauthorized，或 LINE 授權失敗
      "404":
        description: 此部署未啟用 LINE 登入
      "409":
        description: 此帳號已綁定 LINE，或此 LINE 帳號已綁定其他使用者
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/ErrorResponse"
  delete:
    tags:
      - Me
    summary: "解除綁定 LINE 帳號"
    description: |
      解除目前帳號的 LINE 綁定。至少要保留一種登入方式：只有 LINE 而沒有密碼的帳號必須先呼叫 `PUT /me/password`。

      **權限 Access Control**:
      - **Login Required**: 任何已登入的使用者。
    operationId: unlinkLineIdentity
    security:
      - bearerAuth: []
    responses:
      "204":
        description: No Content - 已解除綁定
      "401":
        description: Unauthorized
      "404":
        description: 此帳號未綁定 LINE
      "409":
        description: 這是唯一的登入方式，需先設定密碼
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/ErrorResponse"

password:
  put:
    tags:
      - Me
    summary: "為沒有密碼的帳號設定密碼"
    description: |
      讓以 LINE 註冊的帳號補上 email/密碼登入。不需要舊密碼，且每個帳號只能設定一次
      （已有密碼時回 `409`）。帳號尚無 email 時必須提供 `email`；已有 email 時忽略此欄位。

      **權限 Access Control**:
      - **Login Required**: 任何已登入的使用者。
    operationId: setPassword
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/user.yml#/SetPasswordRequest"
    responses:
      "204":
        description: No Content - 已設定
      "400":
        description: 密碼長度不符，或帳號沒有 email 且未提供
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/ErrorResponse"
      "401":
        description: Unauthorized
      "409":
        description: 已設定過密碼，或 email 已被其他帳號使用
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yml#/ErrorResponse"
