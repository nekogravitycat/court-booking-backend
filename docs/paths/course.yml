      schema:
        type: string
        enum:
        - active
        - cancelled
    - name: payment_status
      in: query
      schema:
        type: string
        enum:
        - not_required
        - unpaid
        - reported
        - paid
        - refunded
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../components/schemas/common.yml#/PageResponse
              - type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: ../components/schemas/course.yml#/EnrollmentResponse
enrollmentDetail:
  get:
    tags:
    - Enrollments
    summary: 取得報名詳情 (本人 / 開課者 / 系統管理員)
    security:
    - bearerAuth: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              $ref: ../components/schemas/course.yml#/EnrollmentResponse
      '404':
